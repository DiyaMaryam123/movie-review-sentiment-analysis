<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Movie Sentiment Analyser</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#0d0d0d;--cream:#f5f0e8;--gold:#c9a84c;--card:#fffdf7;--muted:#7a7060;--border:#e0d9cc;--green:#27ae60;--red:#c0392b}
  *{box-sizing:border-box;margin:0;padding:0}
  body {
  background: url('bg1.jpg') no-repeat center center fixed;
  background-size: cover;
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}
  header{
  background:var(--ink);
  color:var(--cream);
  padding:1.2rem 2rem;
  border-bottom:3px solid var(--gold);
  display:flex;
  justify-content:center; 
  align-items:center;
  gap:1rem
  }
  header h1{
  text-align:center;
  width:100%;
  }
  header h1{font-family:'Playfair Display',serif;font-size:2.4rem}
  header h1 span{color:var(--gold)}
  header p{margin-left:auto;font-size:.78rem;opacity:.5}
  main{max-width:700px;margin:0 auto;padding:2.5rem 1.5rem}
  .hero{text-align:center;margin-bottom:2.5rem}
  .hero h2{font-family:'Playfair Display',serif;font-size:2.4rem;margin-bottom:.6rem}
  .hero p{
  font-family:'Playfair Display',serif;
  color:#5d4037;          /* black */
  font-size:1.5rem;   /* slightly bigger */
  font-weight:500;
  }
  
  
  @keyframes blink {
  0%   { opacity: 1; }
  50%  { opacity: 0; }
  100% { opacity: 1; }
}

.subtitle{
  animation: blink 1.0s infinite;
  color: #000;
  font-size: 1.1rem;
  font-weight: 500;
}
  
  
  
  
  .card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:2rem;box-shadow:0 6px 30px rgba(0,0,0,.08)}
  label{display:block;font-size:.78rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  textarea{width:100%;height:150px;resize:vertical;background:#fff8ee;border:2px solid var(--border);border-radius:3px;padding:.9rem 1rem;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--ink);line-height:1.6;outline:none;transition:border-color .2s}
  textarea:focus{border-color:var(--gold)}
  .hint{font-size:.75rem;color:var(--muted);text-align:right;margin-top:.3rem;margin-bottom:1.2rem}
  .examples{margin-bottom:1.4rem}
  .examples p{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem}
  .pills{display:flex;gap:.5rem;flex-wrap:wrap}
  .pill{font-size:.78rem;padding:.3rem .8rem;border:1px solid var(--border);border-radius:20px;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink);transition:all .15s}
  .pill:hover{background:var(--gold);border-color:var(--gold);color:#fff}
  .btn{width:100%;padding:.9rem;background:var(--ink);color:var(--cream);border:none;border-radius:3px;cursor:pointer;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;letter-spacing:.06em;transition:background .2s}
  .btn:hover{background:#222}
  .btn:disabled{background:#999;cursor:not-allowed}
  .result{margin-top:1.5rem;padding:1.5rem;border-radius:3px;border:2px solid transparent;display:none;animation:up .35s ease both}
  .result.show{display:block}
  .result.positive{background:#f0faf4;border-color:var(--green)}
  .result.negative{background:#fdf0f0;border-color:var(--red)}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
  .verdict-icon{font-size:2.2rem}
  .verdict h3{font-family:'Playfair Display',serif;font-size:1.3rem}
  .result.positive .verdict h3{color:var(--green)}
  .result.negative .verdict h3{color:var(--red)}
  .verdict p{font-size:.82rem;color:var(--muted);margin-top:.15rem}
  .stars{font-size:1.3rem;margin-bottom:1rem;letter-spacing:2px}
  .bar-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.35rem}
  .bar{background:#e0d9cc;border-radius:20px;height:9px;overflow:hidden}
  .bar-fill{height:100%;border-radius:20px;transition:width 1s ease}
  .result.positive .bar-fill{background:var(--green)}
  .result.negative .bar-fill{background:var(--red)}
  .meta{display:flex;gap:1.2rem;margin-top:1rem;font-size:.78rem;color:var(--muted)}
  .meta strong{color:var(--ink)}
  .err{display:none;margin-top:.8rem;padding:.7rem 1rem;background:#fdf0f0;border:1px solid #e07070;border-radius:3px;font-size:.82rem;color:var(--red)}
  .err.show{display:block}
  footer{text-align:center;padding:2rem;font-size:.72rem;color:var(--muted);
  margin-top:4rem}
</style>
</head>
<body>
<header>
  <h1>Movie  Review<span>  Analyser</span></h1>
</header>
<main>
  <div class="hero">
    <p class="subtitle">This model predicts Positive or Negative sentiments.</p>
  </div>
  <div class="card">
    <div class="examples">
      <p>Try an example</p>
      <div class="pills">
        <button class="pill" onclick="setExample('This film was a masterpiece. The acting was incredible and the story was deeply moving.')">Positive</button>
        <button class="pill" onclick="setExample('Complete waste of time. Boring plot, bad acting, and a terrible ending.')">Negative</button>
        <button class="pill" onclick="setExample('It had some good moments but overall felt average and forgettable.')">Mixed</button>
      </div>
    </div>
    <label for="review">Your review</label>
    <textarea id="review" placeholder="Type or paste a movie review here…" maxlength="3000" oninput="updateHint()"></textarea>
    <div class="hint"><span id="cnt">0</span> / 3000</div>
    <button class="btn" id="btn" onclick="analyse()">Analyse Review</button>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div class="verdict">
        <div class="verdict-icon" id="icon"></div>
        <div>
          <h3 id="label"></h3>
          <p id="sub"></p>
        </div>
      </div>
      <div class="stars" id="stars"></div>
      <div class="bar-label">Confidence</div>
      <div class="bar"><div class="bar-fill" id="bar" style="width:0%"></div></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</main>
<footer> </footer>

<script>
  const API = 'https://sentiment-backend-m8g1.onrender.com';   // ← change this if deploying

  function setExample(t){ document.getElementById('review').value=t; updateHint(); }
  function updateHint(){ document.getElementById('cnt').textContent=document.getElementById('review').value.length; }

  async function analyse(){
    const review = document.getElementById('review').value.trim();
    if(review.length < 10){ showErr('Please write at least a sentence.'); return; }
    hideErr(); hideResult();
    const btn = document.getElementById('btn');
    btn.disabled=true; btn.textContent='Analysing…';
    try {
      const res  = await fetch(API+'/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review})});
      if(!res.ok) throw new Error('Server error '+res.status);
      const d = await res.json();
      showResult(d);
    } catch(e){
      showErr('Cannot reach the API. Make sure the backend is running on port 8000. ('+e.message+')');
    } finally {
      btn.disabled=false; btn.textContent='Analyse Review';
    }
  }

  function showResult(d){
    const pos = d.sentiment==='positive';
    const el  = document.getElementById('result');
    el.className = 'result '+(pos?'positive':'negative')+' show';
    document.getElementById('icon').textContent  = pos ? '🎬' : '📽️';
    document.getElementById('label').textContent = pos ? 'Positive Sentiment' : 'Negative Sentiment';
    document.getElementById('sub').textContent   = (d.confidence*100).toFixed(1)+'% confidence · score '+d.score.toFixed(3);
    document.getElementById('stars').textContent = Array.from({length:5},(_,i)=>i<d.stars?'★':'☆').join('');
    setTimeout(()=>{ document.getElementById('bar').style.width=(d.confidence*100).toFixed(1)+'%'; },80);
    document.getElementById('meta').innerHTML =
      '<span>Stars <strong>'+d.stars+'/5</strong></span>'+
      '<span>Latency <strong>'+d.latency_ms+'ms</strong></span>';
  }

  function hideResult(){ document.getElementById('result').className='result'; }
  function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.className='err show'; }
  function hideErr(){ document.getElementById('err').className='err'; }

  document.getElementById('review').addEventListener('keydown',e=>{ if(e.ctrlKey&&e.key==='Enter') analyse(); });
</script>
</body>
</html>
